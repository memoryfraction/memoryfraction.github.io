name: NuGet download stats

on:
  schedule:
    # daily at 11:30 UTC (07:30 US Eastern / 06:30 US Central)
    - cron: "30 11 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "scripts/nuget_stats.py"
      - ".github/workflows/nuget-stats.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: nuget-stats
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: python -m pip install --quiet matplotlib

      - name: Snapshot + render chart
        run: python scripts/nuget_stats.py

      - name: Commit & push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats charts
          if git diff --cached --quiet; then
            echo "no changes to commit"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(stats): update NuGet download snapshot $(date -u +%Y-%m-%d)"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Pages deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref master
