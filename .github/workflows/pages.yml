name: Deploy site to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "stats/**"
      - "legacy/**"
      - "charts/**"
      - "README.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Assemble site
        run: |
          mkdir -p build/stats build/charts build/memoryfraction
          cp stats/index.html build/index.html
          cp stats/index.html build/stats/index.html
          cp stats/history.jsonl build/history.jsonl
          cp stats/history.jsonl build/stats/history.jsonl
          cp charts/nuget-downloads.png build/charts/nuget-downloads.png
          cp legacy/memoryfraction-index.html build/memoryfraction/index.html

      - uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
